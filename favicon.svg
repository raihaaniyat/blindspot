<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a1d2e"/>
  
  <!-- Vision cone (yellow triangle) -->
  <path d="M 256 256 L 450 150 A 250 250 0 0 1 450 362 Z" fill="#ffd966" opacity="0.4"/>
  <path d="M 256 256 L 450 150 A 250 250 0 0 1 450 362 Z" fill="none" stroke="#ffd966" stroke-width="4"/>
  
  <!-- Eye symbol (stylized) -->
  <ellipse cx="256" cy="256" rx="80" ry="50" fill="#4a9eff" stroke="#6bb5ff" stroke-width="6"/>
  <circle cx="256" cy="256" r="30" fill="#1a1d2e"/>
  <circle cx="256" cy="256" r="15" fill="#6bb5ff"/>
  
  <!-- Subtle glow effect -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffd966" stroke-width="2" opacity="0.3"/>
</svg>
